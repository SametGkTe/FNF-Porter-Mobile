<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>FNF Porter For Mobile</title>
<style>
:root{
  --bg:#000; --card:#000; --card2:#0a0a0a; --line:#2a2a2a;
  --text:#fff; --muted:#8a8a8a; --ok:#fff; --warn:#ccc; --err:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Roboto,system-ui,-apple-system,sans-serif;overflow-x:hidden}
body{min-height:100%;padding-bottom:140px}
header{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:12px;
  padding:14px 16px 12px;
  background:#000;border-bottom:1px solid #222;
}
header img{width:46px;height:46px;border-radius:10px;border:1px solid #333}
h1{margin:0;font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
h1 span{display:block;font-size:11px;letter-spacing:.14em;color:#888;font-weight:600}
.wrap{padding:12px 14px 8px}
.banner{
  display:none;align-items:center;justify-content:space-between;gap:10px;
  background:#000;border:1px solid #444;border-radius:12px;padding:12px 14px;margin-bottom:12px
}
.banner.show{display:flex}
.banner p{margin:0;font-size:13px;line-height:1.35;color:#ddd}
.btn{
  border:1px solid #444;border-radius:10px;padding:10px 14px;font-weight:700;letter-spacing:.03em;
  cursor:pointer;font-size:13px;background:#000;color:#fff
}
.btn:active{background:#111}
.btn-solid{background:#fff;color:#000;border-color:#fff}
.btn:disabled{opacity:.4}
.card{background:#000;border:1px solid #222;border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#888}
.path-row{display:flex;gap:8px;margin-bottom:10px}
.path-row:last-child{margin-bottom:0}
.path-box{flex:1;min-width:0;background:#000;border:1px solid #2a2a2a;border-radius:10px;padding:8px 10px}
.path-box label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-bottom:3px}
.path-box .val{font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.path-box.empty .val{color:#666}
.hint{font-size:11px;color:#888;margin:-4px 0 10px 2px;min-height:14px}
.hint.bad{color:#fff}
.hint.ok{color:#bbb}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid #333;background:#000;color:#fff;
  border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700
}
.chip.on{border-color:#fff;background:#fff;color:#000}
.opt{display:flex;align-items:flex-start;gap:10px;padding:8px 2px}
.opt.sub{padding-left:28px}
.opt input{accent-color:#fff;width:18px;height:18px;margin-top:1px}
.opt .t{font-size:14px;font-weight:600}
.opt .d{font-size:11px;color:#888;margin-top:2px;line-height:1.3}
.opt.disabled{opacity:.4;pointer-events:none}
.links{display:flex;gap:8px;flex-wrap:wrap}
.tiktok{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid #333;background:#000;color:#fff;
  border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700
}
.tiktok svg{width:18px;height:18px;display:block}
.log{
  background:#000;border:1px solid #222;border-radius:12px;padding:10px;
  height:180px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.45;color:#cfcfcf
}
.log .INFO{color:#cfcfcf}.log .WARN{color:#bbb}.log .ERROR{color:#fff}
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:#000;border-top:1px solid #222;
}
.convert{
  width:100%;border:1px solid #fff;border-radius:12px;padding:15px;
  font-size:16px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:#000;background:#fff;
}
.convert.busy{letter-spacing:.06em;background:#111;color:#fff;border-color:#333}
.credit{text-align:center;margin-top:8px;font-size:10px;line-height:1.45;letter-spacing:.02em;color:#888}
.modal{
  display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);
  align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.sheet{width:100%;max-height:86vh;background:#000;border-top:1px solid #333;border-radius:18px 18px 0 0;padding:12px 12px 18px;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheet-h b{font-size:15px}
.crumbs{font-size:11px;color:#888;word-break:break-all;margin-bottom:8px}
.shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.shortcuts button{background:#000;border:1px solid #333;color:#fff;border-radius:999px;padding:6px 10px;font-size:11px}
.list{flex:1;overflow:auto;border:1px solid #222;border-radius:12px;background:#000}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #1a1a1a;font-size:14px}
.item:active{background:#111}
.item .ic{width:28px;text-align:center}
.item.file{opacity:.4}
.sheet-actions{display:flex;gap:8px;margin-top:10px}
.sheet-actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);background:#000;border:1px solid #444;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:30;display:none}
.note{font-size:11px;color:#777;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<header>
  <img src="icon.png" alt=""/>
  <h1>FNF Porter For Mobile <span id="ver">PSYCH ↔ V-SLICE</span></h1>
</header>
<div class="wrap">
  <div id="perm" class="banner">
    <p>All files access is required to read and write mod folders.</p>
    <button class="btn btn-solid" onclick="Android.requestPermission()">Grant</button>
  </div>

  <div class="card">
    <h2>Mode</h2>
    <div class="presets">
      <button class="chip on" id="modeP2V" onclick="setMode('p2v')">Psych → V-Slice</button>
      <button class="chip" id="modeV2P" onclick="setMode('v2p')">V-Slice → Psych</button>
    </div>
  </div>

  <div class="card">
    <h2>Folders</h2>
    <div class="path-row">
      <div id="modBox" class="path-box empty"><label id="modLbl">Psych Engine mod</label><div class="val" id="modVal">Select folder…</div></div>
      <button class="btn" onclick="openPicker('mod')">Files</button>
    </div>
    <div class="hint" id="modHint"></div>
    <div class="path-row">
      <div id="outBox" class="path-box empty"><label id="outLbl">Base Game mods folder</label><div class="val" id="outVal">Select folder…</div></div>
      <button class="btn" onclick="openPicker('out')">Files</button>
    </div>
    <div class="hint" id="outHint"></div>
  </div>

  <div class="card" id="presetCard">
    <h2>Presets</h2>
    <div class="presets">
      <button class="chip on" data-p="full" onclick="preset('full')">Full Mod</button>
      <button class="chip" data-p="charts" onclick="preset('charts')">Only Charts</button>
      <button class="chip" data-p="audio" onclick="preset('audio')">Only Audio</button>
      <button class="chip" data-p="chars" onclick="preset('chars')">Only Characters</button>
      <button class="chip" data-p="stages" onclick="preset('stages')">Only Stages</button>
      <button class="chip" data-p="custom" onclick="preset('custom')">Custom</button>
    </div>
  </div>

  <div class="card" id="optsP2V">
    <h2>Options</h2>
    <label class="opt"><input type="checkbox" id="charts" checked onchange="parentToggle('charts',['events'])"><div><div class="t">Charts</div><div class="d">Convert song charts from the data/ directory</div></div></label>
    <label class="opt sub"><input type="checkbox" id="events" checked><div><div class="t">Events</div><div class="d">Play Animation, Alt Animation, Change Character</div></div></label>

    <label class="opt"><input type="checkbox" id="songs" checked onchange="parentToggle('songs',['insts','voices','music','sounds'])"><div><div class="t">Audio</div><div class="d">Copy Inst, Voices, music and sounds</div></div></label>
    <label class="opt sub"><input type="checkbox" id="insts" checked><div><div class="t">Instrumentals</div><div class="d">Inst.ogg files</div></div></label>
    <label class="opt sub"><input type="checkbox" id="voices" checked><div><div class="t">Voices</div><div class="d">Voices.ogg / split vocal files</div></div></label>
    <label class="opt sub"><input type="checkbox" id="music" checked><div><div class="t">Music</div><div class="d">music/ folder</div></div></label>
    <label class="opt sub"><input type="checkbox" id="sounds" checked><div><div class="t">Sounds</div><div class="d">sounds/ folder</div></div></label>
    <label class="opt sub disabled"><input type="checkbox" id="vocalsplit" disabled><div><div class="t">Vocal Split</div><div class="d">Not available on Android — Voices.ogg is copied as-is</div></div></label>

    <label class="opt"><input type="checkbox" id="chars" checked onchange="parentToggle('chars',['icons','jsons','charassets'])"><div><div class="t">Characters</div><div class="d">characters/ json + icons + sprites</div></div></label>
    <label class="opt sub"><input type="checkbox" id="icons" checked><div><div class="t">Health Icons</div><div class="d">Icons + 50×50 freeplay icons</div></div></label>
    <label class="opt sub"><input type="checkbox" id="jsons" checked><div><div class="t">.json files</div><div class="d">Character json format</div></div></label>
    <label class="opt sub"><input type="checkbox" id="charassets" checked><div><div class="t">Assets</div><div class="d">images/characters png + xml</div></div></label>

    <label class="opt"><input type="checkbox" id="weeks" checked onchange="parentToggle('weeks',['props','titles','levels'])"><div><div class="t">Weeks</div><div class="d">Story mode level conversion</div></div></label>
    <label class="opt sub"><input type="checkbox" id="props" checked><div><div class="t">Menu Characters (Props)</div></div></label>
    <label class="opt sub"><input type="checkbox" id="titles" checked><div><div class="t">Week Images (Titles)</div></div></label>
    <label class="opt sub"><input type="checkbox" id="levels" checked><div><div class="t">Levels</div></div></label>

    <label class="opt"><input type="checkbox" id="stages" checked><div><div class="t">Stages</div><div class="d">Stage json + lua prop extract</div></div></label>
    <label class="opt"><input type="checkbox" id="meta" checked><div><div class="t">Pack Meta</div><div class="d">pack.json / pack.png / credits</div></div></label>
    <label class="opt"><input type="checkbox" id="images" checked><div><div class="t">Images</div><div class="d">Remaining images/ (excluded folders skipped)</div></div></label>
    <label class="opt"><input type="checkbox" id="scripts" checked><div><div class="t">Scripts</div><div class="d">Psych Lua → V-Slice HScript (.hxc)</div></div></label>
  </div>

  <div class="card" id="optsV2P" style="display:none">
    <h2>Options</h2>
    <label class="opt"><input type="checkbox" id="rp_charts" checked><div><div class="t">Charts</div><div class="d">V-Slice chart + metadata → Psych song json</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_metadata" checked><div><div class="t">Pack Meta</div><div class="d">_polymod_meta.json → pack.json / pack.png</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_characters" checked><div><div class="t">Characters</div><div class="d">data/characters → characters/</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_char_assets" checked><div><div class="t">Character Assets</div><div class="d">shared/images/characters → images/characters</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_icons" checked><div><div class="t">Health Icons</div><div class="d">images/icons</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_songs" checked><div><div class="t">Songs</div><div class="d">songs/ audio folders</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_stages" checked><div><div class="t">Stages</div><div class="d">Stage json + generated lua</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_images" checked><div><div class="t">Images</div><div class="d">shared/images → images/</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_weeks" checked><div><div class="t">Weeks</div><div class="d">data/levels → weeks/</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_sounds" checked><div><div class="t">Sounds / Music</div><div class="d">sounds/ and music/</div></div></label>
    <label class="opt"><input type="checkbox" id="rp_scripts" checked><div><div class="t">Scripts</div><div class="d">HScript (.hx/.hxc) → Psych Lua</div></div></label>
  </div>

  <div class="card">
    <h2>Log</h2>
    <div class="links" style="margin-bottom:8px">
      <button class="btn" onclick="clearLog()">Clear</button>
      <button class="btn" onclick="createIssue()">Create an issue</button>
      <button class="tiktok" onclick="openTikTok()" aria-label="SametGkTe on TikTok">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill="#fff" d="M14.5 3c.4 2.6 2.1 4.4 4.6 4.7v3.1c-1.6 0-3.1-.5-4.4-1.4v6.5c0 3.4-2.7 6.1-6.1 6.1S2.5 19.3 2.5 15.9 5.2 9.8 8.6 9.8c.4 0 .8 0 1.2.1v3.2c-.4-.2-.8-.3-1.2-.3-1.7 0-3 1.4-3 3.1s1.4 3.1 3 3.1 3-1.4 3-3.1V3h2.9z"/>
        </svg>
        SametGkTe
      </button>
    </div>
    <div id="log" class="log"></div>
    <div class="note" id="logpath"></div>
  </div>
</div>

<div class="bar">
  <button id="go" class="convert" onclick="go()">Convert</button>
  <div class="credit">Android Ported By GkTe's Archive Tool 2.5.21<br/>FNF Porter Original By Gusborg, tposejank, BombasticTom &amp; VocalFan</div>
</div>

<div id="toast" class="toast"></div>

<script>
var modPath='', outPath='', pickTarget='mod', currentPath='/', parentPath='/';
var converting=false, mode='p2v';

function setMode(m){
  mode=m;
  document.getElementById('modeP2V').classList.toggle('on', m==='p2v');
  document.getElementById('modeV2P').classList.toggle('on', m==='v2p');
  document.getElementById('optsP2V').style.display = m==='p2v' ? '' : 'none';
  document.getElementById('optsV2P').style.display = m==='v2p' ? '' : 'none';
  document.getElementById('presetCard').style.display = m==='p2v' ? '' : 'none';
  document.getElementById('modLbl').textContent = m==='p2v' ? 'Psych Engine mod' : 'V-Slice / Base Game mod';
  document.getElementById('outLbl').textContent = m==='p2v' ? 'Base Game mods folder' : 'Psych Engine mods folder';
}

try{ document.getElementById('ver').textContent = 'v'+Android.version()+'  ·  PSYCH → BASE'; }catch(e){}

function onPermission(ok){
  document.getElementById('perm').classList.toggle('show', !ok);
}
function onRestore(mod, out){
  if(mod) setPath('mod', mod);
  if(out) setPath('out', out);
  refreshHint('mod', modPath);
  refreshHint('out', outPath);
  try{ document.getElementById('logpath').textContent = Android.logPath(); }catch(e){}
}
function onLog(line){
  var el=document.getElementById('log');
  var div=document.createElement('div');
  if(line.indexOf('[ERROR]')>=0) div.className='ERROR';
  else if(line.indexOf('[WARN]')>=0) div.className='WARN';
  else div.className='INFO';
  div.textContent=line;
  el.appendChild(div);
  el.scrollTop=el.scrollHeight;
}
function onConvertDone(ok, msg){
  converting=false;
  var b=document.getElementById('go');
  b.disabled=false; b.classList.remove('busy'); b.textContent='Convert';
  toast(ok ? 'Conversion complete!' : ('Error: '+msg));
}

function setPath(which, path){
  if(which==='mod'){ modPath=path; var b=document.getElementById('modBox'); var v=document.getElementById('modVal'); }
  else { outPath=path; var b=document.getElementById('outBox'); var v=document.getElementById('outVal'); }
  v.textContent=path||'Select folder…';
  b.classList.toggle('empty', !path);
  try{ Android.rememberPath(which, path); }catch(e){}
  refreshHint(which, path);
}
function refreshHint(which, path){
  var el=document.getElementById(which==='mod'?'modHint':'outHint');
  if(!el) return;
  if(!path){ el.textContent=''; el.className='hint'; return; }
  try{
    var info=JSON.parse(Android.validateFolder(path, which, mode));
    el.textContent=info.hint||'';
    el.className='hint '+(info.ok?'ok':'bad');
  }catch(e){ el.textContent=''; }
}
function parentToggle(parent, kids){
  var on=document.getElementById(parent).checked;
  kids.forEach(function(id){
    var el=document.getElementById(id);
    if(!el || el.disabled) return;
    el.disabled=!on;
    el.parentElement.classList.toggle('disabled', !on);
  });
}
function allChecks(on, enable){
  ['charts','events','songs','insts','voices','music','sounds','chars','icons','jsons','charassets','weeks','props','titles','levels','stages','meta','images','scripts'].forEach(function(id){
    var el=document.getElementById(id);
    el.checked=on; el.disabled=!enable;
    el.parentElement.classList.toggle('disabled', !enable);
  });
  document.getElementById('vocalsplit').checked=false;
  document.getElementById('vocalsplit').disabled=true;
  document.getElementById('vocalsplit').parentElement.classList.add('disabled');
}
function preset(name){
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-p')===name); });
  if(name==='full'){ allChecks(true,false); }
  if(name==='charts'){ allChecks(false,false); document.getElementById('charts').checked=true; document.getElementById('events').checked=true; document.getElementById('charts').disabled=false; document.getElementById('charts').parentElement.classList.remove('disabled'); }
  if(name==='audio'){ allChecks(false,false); ['songs','insts','voices','music','sounds'].forEach(function(id){ document.getElementById(id).checked=true; }); document.getElementById('songs').disabled=false; document.getElementById('songs').parentElement.classList.remove('disabled'); }
  if(name==='chars'){ allChecks(false,false); ['chars','icons','jsons','charassets'].forEach(function(id){ document.getElementById(id).checked=true; }); document.getElementById('chars').disabled=false; document.getElementById('chars').parentElement.classList.remove('disabled'); }
  if(name==='stages'){ allChecks(false,false); document.getElementById('stages').checked=true; document.getElementById('stages').disabled=false; document.getElementById('stages').parentElement.classList.remove('disabled'); }
  if(name==='custom'){ allChecks(true,true); }
}
function optionsJson(){
  return JSON.stringify({
    charts:{ songs:cb('charts'), events:cb('charts') && cb('events') },
    songs:{ inst:cb('songs')&&cb('insts'), voices:cb('songs')&&cb('voices'), split:false, music:cb('songs')&&cb('music'), sounds:cb('songs')&&cb('sounds') },
    characters:{ json:cb('chars')&&cb('jsons'), icons:cb('chars')&&cb('icons'), assets:cb('chars')&&cb('charassets') },
    weeks:{ props:cb('weeks')&&cb('props'), levels:cb('weeks')&&cb('levels'), titles:cb('weeks')&&cb('titles') },
    stages:cb('stages'),
    modpack_meta:cb('meta'),
    images:cb('images'),
    scripts:cb('scripts')
  });
}
function cb(id){ return document.getElementById(id).checked; }

function go(){
  if(converting) return;
  if(!modPath || !outPath){ toast('Select both folders first.'); return; }
  converting=true;
  var b=document.getElementById('go');
  b.disabled=true; b.classList.add('busy'); b.textContent='Working…';
  var opts = mode==='v2p' ? reverseOptionsJson() : optionsJson();
  Android.convertMode(mode, modPath, outPath, opts);
}
function reverseOptionsJson(){
  return JSON.stringify({
    charts:cb('rp_charts'), metadata:cb('rp_metadata'),
    characters:cb('rp_characters'), char_assets:cb('rp_char_assets'),
    icons:cb('rp_icons'), songs:cb('rp_songs'), stages:cb('rp_stages'),
    images:cb('rp_images'), weeks:cb('rp_weeks'), sounds:cb('rp_sounds'),
    scripts:cb('rp_scripts')
  });
}
function clearLog(){ document.getElementById('log').innerHTML=''; }
function openTikTok(){ Android.openUrl('https://www.tiktok.com/@sametgkte'); }
function createIssue(){
  try { Android.copyLog(); } catch(e) {}
  toast('Log copied. Paste it in the issue.');
  Android.openUrl('https://github.com/SametGkTe/FNF-Porter-Mobile/issues/new/choose');
}

function openPicker(which){
  pickTarget=which;
  Android.pickFolder(which);
}
function toast(t){
  var el=document.getElementById('toast'); el.textContent=t; el.style.display='block';
  setTimeout(function(){ el.style.display='none'; }, 2600);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);});}

try{ onPermission(Android.hasPermission()); }catch(e){}
</script>
</body>
</html>
