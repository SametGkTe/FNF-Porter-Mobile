name: Conversion Error
description: Crash or error while converting a mod on Android
title: "[ERROR]: "
labels: ["bug"]
body:
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Psych → V-Slice
        - V-Slice → Psych
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: Preset / options
      options:
        - Full Mod
        - Only Charts
        - Only Audio
        - Only Characters
        - Only Stages
        - Custom
    validations:
      required: true
  - type: textarea
    id: custom
    attributes:
      label: If Custom, which options were on?
  - type: input
    id: android
    attributes:
      label: Android version / device
      placeholder: Android 14, Pixel 7
  - type: textarea
    id: log
    attributes:
      label: App log (paste here)
      description: Use Create an issue in the app to copy the log.
      render: text
    validations:
      required: true
  - type: textarea
    id: folder
    attributes:
      label: What is in the mod folder? (top-level names)
  - type: textarea
    id: extra
    attributes:
      label: Additional context
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I granted All files access
        - label: I searched existing issues first
          required: true
